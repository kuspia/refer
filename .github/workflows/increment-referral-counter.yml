name: Increment referral counter

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: referral-counter-update
  cancel-in-progress: false

jobs:
  increment:
    runs-on: ubuntu-latest
    steps:
      - name: Check out counter data
        uses: actions/checkout@v4
        with:
          ref: counter
          fetch-depth: 1

      - name: Increment referral counter
        shell: bash
        run: |
          set -euo pipefail
          updated_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          jq --arg updated_at "$updated_at" \
            '.count += 1 | .updatedAt = $updated_at' \
            data/counter.json > data/counter.next.json
          mv data/counter.next.json data/counter.json

      - name: Commit updated counter
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/counter.json
          git commit -m "Increment referral counter"
          git push origin HEAD:counter
